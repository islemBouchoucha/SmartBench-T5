<aside class="sidebar">

  <div class="sidebar-logo">
    <i class="fa fa-microchip"></i>
    <span>TF GTW T5</span>
  </div>

  <nav class="sidebar-nav">
    <a routerLink="/dashboard" routerLinkActive="active">
      <i class="fa fa-gauge-high"></i> {{ 'sidebar.dashboard' | translate }}
    </a>
    @if (isAdmin) {
      <a routerLink="/users" routerLinkActive="active">
        <i class="fa fa-users"></i> {{ 'sidebar.users' | translate }}
      </a>
    }
    <a routerLink="/profile" routerLinkActive="active">
      <i class="fa fa-user"></i> {{ 'sidebar.profile' | translate }}
    </a>
    <a routerLink="/settings" routerLinkActive="active">
      <i class="fa fa-gear"></i> {{ 'sidebar.settings' | translate }}
    </a>
  </nav>

  <div class="sidebar-footer">
    @if (username) {
      <div class="user-info">
        <div class="avatar">{{ username.charAt(0).toUpperCase() }}</div>
        <div>
          <span class="user-name">{{ username }}</span>
          <span class="user-role">{{ role }}</span>
        </div>
      </div>
    }
    <button class="logout-btn" (click)="logout()">
      <i class="fa fa-right-from-bracket"></i> {{ 'sidebar.logout' | translate }}
    </button>
  </div>

</aside>
